services:
  postgres:
    image: postgres:16
    container_name: smartfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartfarm
      POSTGRES_PASSWORD: smartfarm_dev_password
      POSTGRES_DB: smartfarm
    ports:
      - "5432:5432"
    volumes:
      - smartfarm_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartfarm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smartfarm_redis_data:/data

volumes:
  smartfarm_postgres_data:
  smartfarm_redis_data: